# Publica no GitHub Pages a pasta `site/`, que é gerada NO PC e vai no Git.
#
# ESTE WORKFLOW NÃO VAI À REDE, E É ESSE O PONTO (2026-09-10)
#     Até hoje ele descarregava o catálogo inteiro da RiftScribe a cada build
#     (o `data/catalog.db` está no .gitignore) e ia buscar os preços ao
#     CardTrader. A 10/09, das 11:55 às 17:45, TODAS as builds morreram ao fim
#     de 45 s no passo do catálogo: o `riftscribe.gg/api` deixou de responder
#     — do Actions e também do PC, portanto era mesmo deles. O site ficou
#     parado na versão das 09:08 com o André fora de casa a olhar para ele.
#
#     Nada disto era preciso: o catálogo completo já está no PC e a colecção
#     também. Agora o `riftvault build` corre lá (tarefas `riftvault-publicar`,
#     de 30 em 30 min, e `riftvault-daily`, às 07:30), o `site/` é commitado, e
#     aqui só se pega na pasta e se publica. Uma RiftScribe em baixo já não
#     pode parar o site.
#
# O QUE ESTE WORKFLOW DEIXOU DE FAZER, E ONDE PASSOU A SER FEITO
#     - `riftvault sync`   -> passo `sync` do `riftvault-daily` (não essencial)
#     - `riftvault map` + `riftvault prices` -> passo `prices` do mesmo
#     - commit do `data/prices.db` -> passo `commit` do mesmo (um só push)
#     - `riftvault build`  -> `riftvault-publicar` e `riftvault-daily`
#
#     Este workflow já não escreve NADA no repositório (por isso `contents`
#     voltou a ser só de leitura).
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirmar que a pasta do site existe
        # Publicar uma pasta vazia deixava o André com um 404 e o Actions verde.
        run: |
          test -f site/api/index.json || {
            echo "site/api/index.json não existe — a pasta do site não está commitada." >&2
            exit 1
          }
          echo "site/: $(du -sh site | cut -f1), gerado em $(python3 -c "import json;print(json.load(open('site/api/index.json'))['generated_at'])")"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
